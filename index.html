<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon_box V1.1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #00ff66;
    font-family: monospace;
    height: 100vh;
    overflow: hidden;
}

#terminal {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#header {
    padding: 12px;
    background: #101010;
    border-bottom: 1px solid #00ff66;
    color: #9cffb8;
}

#output {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

#inputArea {
    display: flex;
    padding: 10px;
    gap: 8px;
    background: #101010;
    border-top: 1px solid #00ff66;
}

#command {
    flex: 1;
    background: #000;
    color: #00ff66;
    border: 1px solid #00ff66;
    padding: 12px;
    font-family: monospace;
    font-size: 16px;
    outline: none;
    border-radius: 6px;
}

button {
    background: #00ff66;
    color: #000;
    border: none;
    padding: 10px 16px;
    font-family: monospace;
    font-weight: bold;
    border-radius: 6px;
}

button:active {
    transform: scale(0.95);
}

#editor {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10;
    flex-direction: column;
}

#editorHeader {
    padding: 10px;
    border-bottom: 1px solid #00ff66;
}

#editorText {
    flex: 1;
    width: 100%;
    resize: none;
    background: #000;
    color: #00ff66;
    border: none;
    outline: none;
    padding: 14px;
    font-family: monospace;
    font-size: 16px;
}

.editorButtons {
    padding: 10px;
    border-top: 1px solid #00ff66;
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<div id="terminal">

    <div id="header">
        🍋 Lemon_box V1.1<br>
        Browser Linux Emulator
    </div>

    <div id="output"></div>

    <div id="inputArea">
        <input
            id="command"
            type="text"
            placeholder="Enter command..."
            autocomplete="off"
        >

        <button onclick="sendCommand()">Send</button>
        <button onclick="clearTerminal()">Clear</button>
    </div>

</div>


<!-- NANO EDITOR -->

<div id="editor">

    <div id="editorHeader">
        GNU nano — <span id="editorFile"></span>
    </div>

    <textarea id="editorText"></textarea>

    <div class="editorButtons">
        <button onclick="saveNano()">Save</button>
        <button onclick="closeNano()">Exit</button>
    </div>

</div>


<script>

const output = document.getElementById("output");
const commandInput = document.getElementById("command");

let currentDir = "/";
let nanoFile = null;


/* =========================
   VIRTUAL FILESYSTEM
========================= */

let filesystem =
    JSON.parse(localStorage.getItem("lemon_filesystem")) || {

    "/": {
        type: "dir"
    },

    "/home": {
        type: "dir"
    },

    "/home/lemon": {
        type: "dir"
    },

    "/README.txt": {
        type: "file",
        content: "Welcome to Lemon_box!"
    }

};


function saveFS() {
    localStorage.setItem(
        "lemon_filesystem",
        JSON.stringify(filesystem)
    );
}


/* =========================
   TERMINAL OUTPUT
========================= */

function print(text = "") {

    output.textContent += text + "\n";

    output.scrollTop = output.scrollHeight;
}


function prompt() {

    return `root@lemon:${currentDir}# `;

}


/* =========================
   PATH HANDLING
========================= */

function normalizePath(path) {

    if (!path || path === ".")
        return currentDir;

    if (path.startsWith("/"))
        return cleanPath(path);

    return cleanPath(currentDir + "/" + path);
}


function cleanPath(path) {

    let parts = path.split("/");
    let result = [];

    for (let part of parts) {

        if (!part || part === ".")
            continue;

        if (part === "..") {

            result.pop();

        } else {

            result.push(part);

        }

    }

    return "/" + result.join("/");
}


/* =========================
   COMMAND PARSER
========================= */

function sendCommand() {

    let input = commandInput.value.trim();

    if (!input)
        return;

    print(prompt() + input);

    commandInput.value = "";

    executeCommand(input);

}


function executeCommand(input) {

    let args = input.match(/(?:[^\s"]+|"[^"]*")+/g) || [];

    let cmd = args.shift();

    args = args.map(x =>
        x.replace(/^"(.*)"$/, "$1")
    );


    switch(cmd) {

        case "help":
            help();
            break;

        case "pwd":
            print(currentDir);
            break;

        case "ls":
            ls(args);
            break;

        case "cd":
            cd(args);
            break;

        case "mkdir":
            mkdir(args);
            break;

        case "touch":
            touch(args);
            break;

        case "cat":
            cat(args);
            break;

        case "echo":
            echo(args);
            break;

        case "rm":
            rm(args);
            break;

        case "clear":
            clearTerminal();
            break;

        case "nano":
            nano(args);
            break;

        case "python":
        case "python3":
            python(args);
            break;

        case "git":
            git(args);
            break;

        case "whoami":
            print("root");
            break;

        case "uname":
            print("Lemon_box ARM64");
            break;

        case "neofetch":
            neofetch();
            break;

        case "exit":
            print("logout");
            break;

        default:
            print(`${cmd}: command not found`);

    }

}


/* =========================
   HELP
========================= */

function help() {

print(`
Lemon_box commands:

File commands:
  ls
  cd <dir>
  pwd
  mkdir <dir>
  touch <file>
  cat <file>
  echo <text>
  rm <file>

Editors:
  nano <file>

Programming:
  python
  python3

Git:
  git init
  git status
  git add
  git commit

System:
  whoami
  uname
  neofetch
  clear
  help
`);

}


/* =========================
   LS
========================= */

function ls(args) {

    let path = normalizePath(args[0] || ".");

    let prefix = path === "/" ? "/" : path + "/";

    let names = [];

    for (let key in filesystem) {

        if (key.startsWith(prefix)) {

            let rest = key.slice(prefix.length);

            if (rest && !rest.includes("/"))
                names.push(rest);

        }

    }

    print(names.join("  "));

}


/* =========================
   CD
========================= */

function cd(args) {

    let path = normalizePath(args[0] || "/");

    if (
        filesystem[path] &&
        filesystem[path].type === "dir"
    ) {

        currentDir = path;

    } else {

        print(`cd: ${args[0]}: No such directory`);

    }

}


/* =========================
   MKDIR
========================= */

function mkdir(args) {

    if (!args.length) {

        print("mkdir: missing operand");
        return;

    }

    let path = normalizePath(args[0]);

    if (filesystem[path]) {

        print("mkdir: already exists");
        return;

    }

    filesystem[path] = {
        type: "dir"
    };

    saveFS();

}


/* =========================
   TOUCH
========================= */

function touch(args) {

    if (!args.length) {

        print("touch: missing file");
        return;

    }

    let path = normalizePath(args[0]);

    if (!filesystem[path]) {

        filesystem[path] = {
            type: "file",
            content: ""
        };

    }

    saveFS();

}


/* =========================
   CAT
========================= */

function cat(args) {

    if (!args.length) {

        print("cat: missing file");
        return;

    }

    let path = normalizePath(args[0]);

    if (
        filesystem[path] &&
        filesystem[path].type === "file"
    ) {

        print(filesystem[path].content);

    } else {

        print(`cat: ${args[0]}: No such file`);

    }

}


/* =========================
   ECHO
========================= */

function echo(args) {

    print(args.join(" "));

}


/* =========================
   RM
========================= */

function rm(args) {

    if (!args.length) {

        print("rm: missing operand");
        return;

    }

    let path = normalizePath(args[0]);

    if (filesystem[path]) {

        delete filesystem[path];

        saveFS();

    } else {

        print(`rm: cannot remove '${args[0]}'`);

    }

}


/* =========================
   NANO
========================= */

function nano(args) {

    if (!args.length) {

        print("nano: missing filename");
        return;

    }

    let path = normalizePath(args[0]);

    if (!filesystem[path]) {

        filesystem[path] = {
            type: "file",
            content: ""
        };

    }

    nanoFile = path;

    document.getElementById("editorFile")
        .textContent = path;

    document.getElementById("editorText")
        .value = filesystem[path].content;

    document.getElementById("editor")
        .style.display = "flex";

}


function saveNano() {

    filesystem[nanoFile].content =
        document.getElementById("editorText").value;

    saveFS();

    closeNano();

    print(`[ nano ] saved ${nanoFile}`);

}


function closeNano() {

    document.getElementById("editor")
        .style.display = "none";

    nanoFile = null;

}


/* =========================
   SIMPLE PYTHON
========================= */

function python(args) {

    if (!args.length) {

        print("Python 3.x — Lemon_box Python runtime");
        print("Type Python code using:");
        print('python -c "print(hello)"');
        return;

    }

    if (args[0] === "-c") {

        let code = args.slice(1).join(" ");

        pythonExecute(code);

        return;

    }

    let path = normalizePath(args[0]);

    if (!filesystem[path]) {

        print(`python: can't open file '${args[0]}'`);
        return;

    }

    let code = filesystem[path].content;

    pythonExecute(code);

}


function pythonExecute(code) {

    let lines = code.split("\n");

    for (let line of lines) {

        line = line.trim();

        let match =
            line.match(/^print\s*\(\s*["'](.*?)["']\s*\)$/);

        if (match) {

            print(match[1]);

            continue;

        }

        let math =
            line.match(/^print\s*\(\s*([0-9+\-*\/(). ]+)\s*\)$/);

        if (math) {

            try {

                print(String(
                    Function(
                        `"use strict";return (${math[1]})`
                    )()
                ));

            } catch {

                print("Python: calculation error");

            }

            continue;

        }

        if (line)
            print(`Python: executed: ${line}`);

    }

}


/* =========================
   GIT
========================= */

function git(args) {

    if (!args.length) {

        print("usage: git <command>");
        return;

    }

    let sub = args[0];

    switch(sub) {

        case "init":

            if (!filesystem[currentDir + "/.git"]) {

                filesystem[currentDir + "/.git"] = {
                    type: "dir"
                };

                saveFS();

            }

            print(
                `Initialized empty Git repository in ${currentDir}/.git/`
            );

            break;


        case "status":

            if (
                filesystem[currentDir + "/.git"]
            ) {

                print("On branch main");
                print("No commits yet.");

            } else {

                print(
                    "fatal: not a git repository"
                );

            }

            break;


        case "add":

            print(
                "Files added to staging area."
            );

            break;


        case "commit":

            print(
                "[main (root-commit)] Lemon_box commit"
            );

            break;


        case "--version":

            print("git version 2.x");

            break;


        default:

            print(
                `git: '${sub}' is not implemented in Lemon_box`
            );

    }

}


/* =========================
   NEOFETCH
========================= */

function neofetch() {

print(`
        🍋🍋🍋
       🍋    🍋
      🍋 Lemon 🍋
       🍋_box 🍋

OS: Lemon_box
Kernel: BrowserKernel
Architecture: ARM64
Shell: lemon-shell
Filesystem: VirtualFS
Package manager: xpkm
Runtime: JavaScript
`);

}


/* =========================
   CLEAR
========================= */

function clearTerminal() {

    output.textContent = "";

}


/* =========================
   ENTER KEY
========================= */

commandInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendCommand();

        }

    }
);


/* =========================
   STARTUP
========================= */

print("🍋 Lemon_box V1.1");
print("Type 'help' for commands.");
print("");

</script>

</body>
    </html>
